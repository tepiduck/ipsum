name: Nightly model watch
on:
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * *'
permissions:
  contents: read
concurrency:
  group: nightly-model-watch
  cancel-in-progress: false
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        model: [resnet50, mobilenet_v3_small]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: watch-wheels-${{ runner.os }}-py312-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-wheels-${{ runner.os }}-py312-${{ matrix.model }}-
      - name: Install compiler
        id: compiler
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y g++ python3-dev
      - name: Install pinned stable CPU packages
        id: install
        continue-on-error: true
        run: |
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.15.0\ntorchvision==0.29.2\n' > watch-constraints.txt
          python -m pip install '.[sweep]' --constraint watch-constraints.txt
          python -m pip check
          python -c 'import torch,torchvision; assert torch.__version__ == "2.15.0+cpu", torch.__version__; assert torchvision.__version__ == "0.29.2+cpu", torchvision.__version__; print(torch.__version__, torchvision.__version__)'
      - name: Identify compatible history cache
        id: history
        continue-on-error: true
        env:
          MODEL: ${{ matrix.model }}
          SOURCE: ${{ hashFiles('src/faultline/*.py') }}
        run: |
          key=$(python -c 'import hashlib,os,platform; print(hashlib.sha256((os.environ.get("ImageVersion", "")+platform.platform()+platform.python_version()+os.environ["SOURCE"]).encode()).hexdigest()[:24])')
          echo "prefix=watch-${MODEL}-${key}" >> "$GITHUB_OUTPUT"
          python -c 'import json,os; open("watch-catalog.json","w").write(json.dumps([{"id":os.environ["MODEL"],"torchvision":os.environ["MODEL"]}]))'
      - uses: actions/cache/restore@v4
        id: restore
        continue-on-error: true
        with:
          key: ${{ steps.history.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.history.outputs.prefix }}-
          path: |
            watch-history/watch.json
            watch-history/memory-budget.json
            watch-history/prepared
            watch-history/records
            watch-history/active-plan.json
            watch-history/plans
            watch-history/checks/**/check.json
            watch-history/checks/**/evidence.json
            watch-history/checks/**/verdict.json
            watch-history/checks/**/report.html
      - name: Compare latest nightly with stable and previous nightly
        id: watch
        continue-on-error: true
        if: steps.install.outcome == 'success' && steps.compiler.outcome == 'success'
        run: |
          python -m faultline.watch_ci --catalog watch-catalog.json --output watch-history --baseline-python "$(which python)" --environment-cache "$RUNNER_TEMP/faultline-nightlies" --max-wall-s 7200
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: watch-${{ matrix.model }}-${{ github.run_id }}
          path: |
            watch-history
            watch-history-archived-*
            !watch-history/stable-environment
            !watch-history/**/compiler-cache
            !watch-history-archived-*/stable-environment
            !watch-history-archived-*/**/compiler-cache
          retention-days: 30
      - name: Save completed timeline and frozen inputs
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          key: ${{ steps.history.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            watch-history/watch.json
            watch-history/memory-budget.json
            watch-history/prepared
            watch-history/records
            watch-history/active-plan.json
            watch-history/plans
            watch-history/checks/**/check.json
            watch-history/checks/**/evidence.json
            watch-history/checks/**/verdict.json
            watch-history/checks/**/report.html
      - name: Set workflow result
        if: always()
        env:
          WATCH_EXIT_CODE: ${{ steps.watch.outputs.exit_code }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILER_OUTCOME: ${{ steps.compiler.outcome }}
          WATCH_OUTCOME: ${{ steps.watch.outcome }}
        run: |
          echo "Nightly reports and frozen evidence: workflow artifact watch-${{ matrix.model }}-${{ github.run_id }}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$WATCH_EXIT_CODE" = 1 ]; then
            echo '::error::REGRESSION: see the model verdict and retained evidence.'
            exit 1
          fi
          if [ -z "$WATCH_EXIT_CODE" ]; then
            reason="INCONCLUSIVE: watch did not produce an exit code (install=$INSTALL_OUTCOME, compiler=$COMPILER_OUTCOME, watch=$WATCH_OUTCOME). Inspect the failed step logs."
            echo "::warning::$reason"
            printf '\n## ⚠️ Nightly watch: INCONCLUSIVE\n\n**This green job is not a SAFE result.**\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: watch-wheels-${{ runner.os }}-py312-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
