name: Faultline validation
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src/faultline tests/faultline scripts examples
      - run: python -m ruff format --check src/faultline tests/faultline scripts examples
      - run: python scripts/check_release.py --index
      - run: python -m build
      - run: python scripts/check_release.py dist/faultline_ml-0.4.0-py3-none-any.whl dist/faultline_ml-0.4.0.tar.gz
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m compiler
      - run: python scripts/validate_faultline.py --compiler --output faultline-runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faultline-evidence
          path: faultline-runs/ci
  upgrade-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: python -m venv .baseline
      - run: .baseline/bin/python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: .baseline/bin/python -m pip install numpy psutil
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Compare releases and exercise automatic regression reduction
        run: python scripts/validate_upgrades.py --compiler --baseline-python .baseline/bin/python --output faultline-runs/upgrades
      - name: Check original-model workloads and native graph reduction
        run: python scripts/validate_native.py --compiler --baseline-python .baseline/bin/python --output faultline-runs/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faultline-upgrade-evidence
          path: |
            faultline-runs/upgrades
            faultline-runs/native
